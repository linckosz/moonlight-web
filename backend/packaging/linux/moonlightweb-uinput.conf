# MoonlightWeb — load the uinput module at boot, for the virtual gamepad.
#
# The udev rule beside this file sets the node's permissions, but permissions on
# a node whose module was never loaded still get you nothing. Most desktop
# distributions load uinput on their own for Steam or for a tablet driver; the
# ones that do not would leave a user with a controller that does nothing and no
# hint as to why, which is exactly the failure worth spending one line on.
uinput
