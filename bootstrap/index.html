<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MoonlightWeb</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05080b">
<!--
  The MoonlightWeb BOOTSTRAP — the entry page, and nothing else.

  What it is
  ----------
  A few kilobytes of HTML and JavaScript. It opens a WebRTC connection to the
  machine named in the address, pulls that machine's interface down through it,
  installs a service worker to serve it, and hands over. From that point the
  application and its API come from the user's own machine. This page is the
  only code that ever comes from a server.

  Where it is served from
  -----------------------
  Two places, on purpose, and the difference matters:

    stream.{domain}/{id}   the address people use. Served by Caddy from the same
                           box as the rendezvous relay. Its own host rather than
                           a path on the apex, so signalling can move to another
                           machine later without touching the marketing site.

    app.{domain}           a byte-identical copy on GitHub Pages, published by
                           .github/workflows/pages.yml, which records the
                           SHA-256 of every file it publishes. NOT an address
                           anyone visits: it is the reference copy a watchdog
                           compares the live host against.

  Be precise about what that buys, because it is easy to overstate. Serving this
  page from the rendezvous box means a compromise of that box CAN hand a browser
  hostile JavaScript holding a legitimate pairing key — MW-BIND-v1 does not
  cover that case, since it binds DTLS fingerprints against a RELAYING server,
  not against one that serves the page. The reference copy does not prevent
  that; it makes it DETECTABLE, within the watchdog's interval, and gives a
  published record of what the bytes were supposed to be.

  Content-Security-Policy is declared twice: as a header by Caddy, and in the
  meta tag below for the Pages copy, which gets no headers at all. Both are
  enforced and they intersect — a directive relaxed in one and not the other
  silently becomes the stricter of the two, so change them together. Neither can
  express frame-ancestors, hence the frame check in frame-guard.js.

  connect-src covers one thing: the WebSocket to the introduction server on this
  same origin. It names the wss: scheme alongside 'self' because CSP3 says 'self'
  already covers a same-origin WebSocket and WebKit has not always agreed —
  relying on the disputed reading would break this page on iOS and nowhere else.
  The connection to the user's machine is WebRTC, which CSP does not gate at all.

  The styling below is deliberately self-contained and deliberately NOT the
  application's stylesheet: this page runs before a single byte of the
  application exists, so it cannot depend on it. It borrows the palette from
  frontend/css/tokens.css so the handover is not a jarring change of scene.

  It does NOT borrow the application's web fonts, and that is a decision rather
  than an omission. The application loads Rajdhani and Share Tech Mono from
  Google, which is unremarkable when the page comes from the user's own machine.
  Here it would mean the entry page — the one whose entire purpose is that no
  third party learns who is talking to whom — telling Google the IP address of
  every visitor before anything else happens. The look comes from the palette,
  the grid and the notched edges; the type is a system stack, and `default-src
  'none'` stays honest.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss:; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<style>
  :root {
    --surface-0: #05080b;
    --surface-2: #0f141b;
    --text-1: #eafdff;
    --text-2: #8ea7b4;
    --text-3: #51626d;
    --accent-1: #fcee0a;
    --neon-cyan: #00e5ff;
    --neon-magenta: #ff2a6d;
    --border-1: rgba(0, 229, 255, 0.16);
    --border-2: rgba(0, 229, 255, 0.34);
    /* The application's own stacks minus their web fonts — the same families
       take over, without a byte leaving this origin. */
    --font-ui: 'Chakra Petch', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display',
               'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SF Mono', 'Cascadia Code', Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--surface-0);
    color: var(--text-1);
    font-family: var(--font-ui);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  /* The same faint grid the application draws behind its views, plus a low
     magenta wash at the bottom — so the handover looks like one product. */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(120% 80% at 50% 120%, rgba(255, 42, 109, 0.10), transparent 60%),
      linear-gradient(var(--border-1) 1px, transparent 1px) 0 0 / 100% 44px,
      linear-gradient(90deg, var(--border-1) 1px, transparent 1px) 0 0 / 44px 100%;
    opacity: .5;
    mask-image: radial-gradient(90% 70% at 50% 45%, #000 30%, transparent 100%);
    -webkit-mask-image: radial-gradient(90% 70% at 50% 45%, #000 30%, transparent 100%);
  }
  /* Its own layer holding one child, exactly like the application's .securing —
     and for a reason worth stating, because centring on <body> is the obvious
     way to do this and it is wrong. <body> is not ours alone: a browser
     extension that appends a node to it becomes a second row of that grid, the
     window is split in two and the seal ends up centred in the top half. That
     is not hypothetical; it is what this page did, mid-load, the moment an
     extension's content script arrived. A fixed layer with a single child has
     nothing to share and cannot be moved by what lands beside it.

     No panel inside it. The seal, the bar and one line sit straight on the
     grid, which is the only background this page has and the one the
     application opens onto — a slab of flat surface colour under them would be
     a second scene to leave. The notched panel belonged to a page with more to
     hold. */
  main {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: max(2rem, env(safe-area-inset-top)) 1.5rem;
  }
  .inner {
    position: relative;
    width: 100%;
    max-width: 30rem;
  }
  /* The application's own header title, to the letter: --fs-lg, weight 700,
     2px tracking, --text-1, and the yellow ring as a halo (layout.css
     .app-header h1, uppercased by the HUD heading rule in base.css). Copied
     rather than approximated — this is the name the next screen shows, and the
     handover should not look like a change of typeface. */
  .brand {
    font-size: 1.125rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    color: var(--text-1);
    text-shadow: 0 0 12px rgba(252, 238, 10, .55);
    margin: 0 0 1.5rem;
  }
  /* Except when it heads an explanation, where a centred label floating over
     left-aligned prose reads as a mistake. */
  body[data-state="failed"] .brand { text-align: left; }
  h1 {
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: .02em;
    margin: 0 0 .4rem;
  }
  p { margin: 0; color: var(--text-2); font-size: .93rem; }
  #detail { font-family: var(--font-mono); font-size: .82rem; color: var(--text-3); min-height: 1.4em; }
  #note { margin-top: 1.4rem; font-size: .85rem; color: var(--text-3); }
  #note a { color: var(--neon-cyan); }
  /* Both are empty while this works, and an empty paragraph still holds its
     margin. That margin is inside the box being centred, so the seal ends up
     about a dozen pixels higher here than in the application's own copy of it —
     and the handover, which is meant to be invisible, starts with a jump. The
     unused slots leave the box until there is something to put in them. */
  #detail:empty,
  #note:empty { display: none; }
  code {
    font-family: var(--font-mono);
    color: var(--neon-cyan);
    font-size: .9em;
    word-break: break-all;
  }

  /* ── The seal ───────────────────────────────────────────────────────────
     A small app card in its launching state — the notched tile with a light
     trail running round its rim — holding a padlock instead of cover art. The
     application draws that card with a conic gradient whose ANGLE is animated,
     which needs @property; here the same sweep is a rotated element behind a
     face that covers all but a 2px rim, so it turns in every browser that will
     run this page at all.

     Green, not the application's yellow. Yellow is what the product uses for
     "this is the thing you act on" — the launch card, the primary button — and
     this tile is not something to act on. Green is the colour a padlock has
     meant in a browser for thirty years, and this is the project's own
     --c-success, so it arrives already meaning "good" rather than as a fourth
     colour invented for one page. */
  :root { --seal: #2ad4a0; }
  .seal {
    position: relative;
    width: 62px;
    aspect-ratio: 1;
    margin: 1.5rem auto .25rem;
    overflow: hidden;
    background: rgba(42, 212, 160, .28);
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  }
  .seal::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 240%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: conic-gradient(transparent 0deg, transparent 215deg,
                               rgba(42, 212, 160, .9) 322deg, transparent 360deg);
    animation: seal-spin 3.2s linear infinite;
  }
  @keyframes seal-spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  /* Until the connection is made this is an app card and nothing more: the
     same cyan sheen over the same glass the application's tiles use, painted
     over an opaque ground so the rim's green cannot tint it. The green belongs
     to the result, so it is withheld until there is one. */
  .seal-face {
    position: absolute;
    inset: 2px;
    display: grid;
    place-items: center;
    background:
      linear-gradient(150deg, rgba(0, 229, 255, .06), rgba(0, 229, 255, 0) 60%),
      linear-gradient(rgba(10, 16, 22, .58), rgba(10, 16, 22, .58)),
      linear-gradient(var(--surface-0), var(--surface-0));
    box-shadow: inset 0 0 0 1px var(--border-2), inset 0 1px 0 rgba(0, 229, 255, .08);
    clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 9px 100%, 0 calc(100% - 9px));
    transition: box-shadow .16s ease;
  }
  /* The green wash on its own layer: a multi-layer background cannot be
     transitioned, and this has to arrive as a quick fade at the very end. */
  .seal-face::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(42, 212, 160, .2), rgba(42, 212, 160, .2)), var(--surface-2);
    opacity: 0;
    transition: opacity .16s ease;
    pointer-events: none;
  }
  .seal-face svg { position: relative; z-index: 1; width: 30px; height: 30px; color: var(--seal); }
  /* The shackle breathes while the connection is being made, and stops when it
     is made. It is the only moving light on the padlock itself, so it carries
     the difference between "closing" and "closed" without a word. */
  .shackle { animation: shackle-glow 1.9s ease-in-out infinite; }
  @keyframes shackle-glow {
    0%, 100% { filter: drop-shadow(0 0 1px rgba(42, 212, 160, .30)); }
    50%      { filter: drop-shadow(0 0 6px rgba(42, 212, 160, .75)); }
  }
  body[data-state="secured"] .seal::before { opacity: 0; transition: opacity .3s ease; }
  body[data-state="secured"] .shackle { animation: none; filter: none; }
  body[data-state="secured"] .seal-face {
    box-shadow: inset 0 0 0 1px rgba(42, 212, 160, .30), inset 0 1px 0 rgba(0, 229, 255, .08);
  }
  body[data-state="secured"] .seal-face::after { opacity: 1; }

  .track {
    height: 3px;
    width: 66%;
    margin: 1.25rem auto .7rem;
    background: rgba(0, 229, 255, .12);
    overflow: hidden;
  }
  /* The number is recomputed every frame; the movement is not. A jump in the
     work term — the shell arriving, the last file landing — would otherwise
     snap the bar across in one paint, which reads as a glitch rather than as
     progress. The transition is retargeted on each frame, so the bar eases
     toward wherever the number has got to instead of teleporting onto it.
     It also lands ~.26s AFTER the number reaches the end, which is why the
     hold in boot.js waits that long before starting to count. */
  #bar {
    height: 100%;
    width: 0;
    transition: width .26s cubic-bezier(.22, .61, .36, 1);
    background: linear-gradient(90deg, rgba(42, 212, 160, .55), var(--seal));
    box-shadow: 0 0 10px rgba(42, 212, 160, .7), 0 0 22px rgba(42, 212, 160, .3);
  }
  #status { text-align: center; font-size: .93rem; letter-spacing: .02em; }
  body[data-state="secured"] #status {
    color: var(--seal);
    text-shadow: 0 0 12px rgba(42, 212, 160, .45);
  }
  /* While this works, the seal and one line say it. The running commentary
     underneath was for me, not for the person waiting — it only reappears when
     something fails and there is actually something to read. */
  body[data-state="working"] #detail,
  body[data-state="secured"] #detail { display: none; }
  /* The headline is the failure voice: while this is working, the seal and the
     line under the bar say everything, and a second heading would compete. */
  h1 { display: none; }
  body[data-state="failed"] h1 { display: block; color: var(--neon-magenta); }
  body[data-state="failed"] .seal,
  body[data-state="failed"] .track,
  body[data-state="failed"] #status { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .seal::before,
    .shackle { animation: none; }
  }
</style>
</head>
<body data-state="working">
<script src="/frame-guard.js"></script>
<main>
  <div class="inner">
    <p class="brand">MoonlightWeb</p>
    <h1 id="stage">Starting…</h1>
    <div class="seal" aria-hidden="true">
      <div class="seal-face">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="14" width="18" height="13" rx="1.5"/>
          <path class="shackle" d="M11 14v-3.2a5 5 0 0 1 10 0V14"/>
          <path d="M16 19v3.4"/>
        </svg>
      </div>
    </div>
    <div class="track"><div id="bar"></div></div>
    <p id="status">Securing the communication…</p>
    <p id="detail"></p>
    <p id="note"></p>
  </div>
</main>
<script type="module" src="/boot.js"></script>
</body>
</html>
