# MoonlightWeb — self-hosted DNS stack (5 dedicated containers).
#
#   dnsdist  public DNS entry point :53  → pdns:5300  (anti-amplification, rate-limit)
#   pdns     official PowerDNS image, internal only    (DNS :5300 + REST API :8081)
#   caddy    public :80/:443 → pdns:8081 / umami:3000  (HTTPS API + site + stats, auto-TLS)
#            also updates.{domain} → mw-proxy:8080 (cached release mirror + census)
#            also metrics.{domain} → mw-proxy:8080 (session census)
#            also stream.{domain} → bootstrap page + /v1/ → mw-rendezvous:8090
#   mw-rendezvous  introduction server, internal only  (held host lines :8090)
#   coturn   STUN only, host network :3478            (public address discovery)
#   umami    web analytics (stats.{domain}), internal  → umami-db (Postgres)
#   umami-db Postgres for Umami, internal only
#
# Quick start:
#   cd deploy/powerdns
#   cp .env.sample .env      # edit MW_DOMAIN / MW_PUBLIC_IP / MW_PDNS_API_KEY
#   docker compose up -d --build
#
# Point your registrar's glue/NS records at MW_PUBLIC_IP (see README.md).

services:
  # ── PowerDNS authoritative server (internal only) ──────────────────────────
  pdns:
    image: powerdns/pdns-auth-49:latest
    container_name: moonlight-pdns
    restart: unless-stopped
    # tini for clean signals; init.sh bootstraps the zone then execs the
    # official startup wrapper. Runs as the image's non-root pdns user.
    entrypoint: ["/usr/bin/tini", "--", "sh", "/mw/init.sh"]
    environment:
      MW_DOMAIN: ${MW_DOMAIN}
      MW_PUBLIC_IP: ${MW_PUBLIC_IP}
      # User-facing key from .env, mapped to the var the official wrapper reads.
      PDNS_AUTH_API_KEY: ${MW_PDNS_API_KEY}
    volumes:
      - pdns_data:/var/lib/powerdns                 # zone DB persists
      - ./pdns/zz-mw.conf:/etc/powerdns/pdns.d/zz-mw.conf:ro
      - ./pdns/init.sh:/mw/init.sh:ro
    networks:
      mwnet:
        # Fixed IP: dnsdist's newServer needs a literal address (it does not
        # resolve container names). Must match dnsdist/dnsdist.conf.
        ipv4_address: 172.28.0.10
    # No published ports: only dnsdist (DNS) and caddy (API) reach it internally.
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]                               # high ports → no caps needed
    pids_limit: 200
    mem_limit: 512m

  # ── mw-proxy: least-privilege filtering gateway for the PowerDNS API ───────
  # Holds the real PowerDNS key internally; clients authenticate with the
  # restricted MW_PDNS_PROXY_KEY and may only create/update/delete their own
  # A record (+ _owner / _acme-challenge TXT) on this zone. Never published:
  # Caddy exposes it as https://dnsapi.${MW_DOMAIN}. See mw-proxy/main.go.
  mw-proxy:
    build: ./mw-proxy
    image: moonlight-mw-proxy:latest
    container_name: moonlight-mw-proxy
    restart: unless-stopped
    depends_on: [pdns]
    environment:
      MW_DOMAIN: ${MW_DOMAIN}
      MW_PDNS_UPSTREAM: http://pdns:8081
      # The REAL PowerDNS key — stays server-side, injected toward pdns only.
      MW_PDNS_API_KEY: ${MW_PDNS_API_KEY}
      # The RESTRICTED key clients present (baked into the app as MW_PDNS_TOKEN).
      MW_PDNS_PROXY_KEY: ${MW_PDNS_PROXY_KEY}
      # HMAC key used to store owner fingerprints — SECRET, server-side only.
      MW_PDNS_OWNER_SECRET: ${MW_PDNS_OWNER_SECRET}
      # New-subdomain rate limit per client IP per hour (0 = unlimited).
      MW_PROXY_MAX_NEW_PER_HOUR: ${MW_PROXY_MAX_NEW_PER_HOUR:-20}
      # `off` stops NEW sub-domains being created; existing ones keep updating
      # and renewing until February 2027. Thrown the day 0.3.0 ships — see
      # README.md §Retiring the sub-domains.
      MW_SUBDOMAIN_REGISTRATION: ${MW_SUBDOMAIN_REGISTRATION:-on}
      # Update relay (updates.${MW_DOMAIN} → /v1/update). Counts which versions
      # are still running, so migrations can be planned on data. Leave
      # MW_UMAMI_WEBSITE_ID empty and the relay still serves updates, counting
      # nothing — see mw-proxy/update.go and README.md §Update relay.
      MW_UMAMI_URL: http://umami:3000
      MW_UMAMI_WEBSITE_ID: ${MW_UMAMI_TELEMETRY_WEBSITE_ID:-}
      # Session census (metrics.${MW_DOMAIN} → /v1/session). Its OWN Umami
      # website, so "views" there means "sessions" and nothing else. Same rule:
      # leave it empty and the endpoint still answers, counting nothing.
      MW_UMAMI_SESSIONS_WEBSITE_ID: ${MW_UMAMI_SESSIONS_WEBSITE_ID:-}
    volumes:
      - mwproxy_data:/data                          # ownership store persists
    networks: [mwnet]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]                               # high port :8080, no caps
    pids_limit: 100
    mem_limit: 128m

  # ── mw-rendezvous: the introduction server ─────────────────────────────────
  # Holds one WebSocket per online host and copies WebRTC signalling between it
  # and the browsers that ask for it by identifier. No media ever passes through:
  # once the two peers have a direct path this process is out of the way. Never
  # published; Caddy exposes it under https://stream.${MW_DOMAIN}/v1/.
  # See mw-rendezvous/main.go.
  mw-rendezvous:
    build: ./mw-rendezvous
    image: moonlight-mw-rendezvous:latest
    container_name: moonlight-mw-rendezvous
    restart: unless-stopped
    environment:
      # HMAC key used to store identifier ownership — SECRET, server-side only.
      # Separate from MW_PDNS_OWNER_SECRET on purpose: that one authorises a DNS
      # zone claim and retires with the sub-domain mechanism in February 2027.
      MW_RDV_OWNER_SECRET: ${MW_RDV_OWNER_SECRET}
      # New-identifier claims per client IP per hour (0 = unlimited).
      MW_RDV_MAX_NEW_PER_HOUR: ${MW_RDV_MAX_NEW_PER_HOUR:-20}
      # Browser connection attempts per client IP per minute. This is what bounds
      # guessing identifiers, so it is a security control, not just hygiene.
      MW_RDV_MAX_PEER_PER_MIN: ${MW_RDV_MAX_PEER_PER_MIN:-30}
      # Concurrent browsers per host.
      MW_RDV_MAX_SESSIONS: ${MW_RDV_MAX_SESSIONS:-4}
    volumes:
      - mwrdv_data:/data                            # identifier claims persist
    networks: [mwnet]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]                               # high port :8090, no caps
    pids_limit: 200
    mem_limit: 128m

  # ── coturn: STUN, and only STUN ────────────────────────────────────────────
  # Answers "what address did this packet come from?" on stream.${MW_DOMAIN}:3478
  # — the name Caddy already serves, so this needs no DNS record of its own and
  # the signed zone is left alone.
  #
  # It exists so that the hosts and the browsers stop asking Google. A STUN
  # binding tells whoever answers the public address of whoever asked, which is
  # precisely the disclosure the Internet-access consent describes; naming the
  # operator the user already agreed to is the difference between a disclosure
  # and a surprise. The clients keep the public servers as a fallback (see
  # StunClient::defaultServers) — a machine that cannot learn its own address
  # cannot be reached at all.
  #
  # --stun-only, so there is no relay: this never carries a byte of anybody's
  # stream, and refusing to be a TURN server is also what keeps it from being
  # used as an amplifier by someone else.
  #
  # network_mode host, and that is not incidental. Docker publishes UDP through
  # the userland proxy by default, which rewrites the source address — a STUN
  # server behind it would confidently answer every client with the bridge
  # gateway's address. Host networking is the only way it sees the real one.
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: moonlight-coturn
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-port=3478
      - --listening-ip=0.0.0.0
      - --stun-only
      - --no-tls
      - --no-dtls
      - --no-cli
      - --no-multicast-peers
      # Do not announce the coturn version to every client that asks.
      - --no-software-attribute
      - --log-file=stdout
      - --simple-log
    security_opt: ["no-new-privileges:true"]
    # NET_BIND_SERVICE is not about the port — 3478 is unprivileged. The
    # turnserver binary carries that capability as a FILE capability, and the
    # kernel refuses to exec a capability-carrying binary when the capability is
    # missing from the bounding set: dropping ALL on its own makes the container
    # die with "Operation not permitted" before turnserver prints a line. Keep
    # the pair together.
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    pids_limit: 100
    mem_limit: 64m

  # ── dnsdist: public DNS front (DoS / amplification protection) ─────────────
  dnsdist:
    image: powerdns/dnsdist-19:latest
    container_name: moonlight-dnsdist
    restart: unless-stopped
    depends_on: [pdns]
    volumes:
      - ./dnsdist/dnsdist.conf:/etc/dnsdist/dnsdist.conf:ro
    ports:
      - "53:53/udp"      # public authoritative DNS (primary path)
      - "53:53/tcp"      # public DNS (truncated answers, DNSSEC)
    networks: [mwnet]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]                   # bind :53
    # dnsdist pre-allocates many sockets (per-IP QPS tracking); raise the FD
    # limit above its ~10k need, otherwise it warns at startup.
    ulimits:
      nofile: { soft: 16384, hard: 16384 }
    pids_limit: 200
    mem_limit: 256m

  # ── Caddy: HTTPS reverse proxy in front of the PowerDNS API ────────────────
  caddy:
    build: ./caddy
    image: moonlight-caddy:latest
    container_name: moonlight-caddy
    restart: unless-stopped
    depends_on: [pdns, mw-proxy, mw-rendezvous]
    environment:
      MW_DOMAIN: ${MW_DOMAIN}
      # Optional user-supplied TLS cert (takes priority over Let's Encrypt).
      # Paths must resolve INSIDE the container — see the ./certs mount below.
      MW_TLS_CERT: ${MW_TLS_CERT:-}
      MW_TLS_KEY: ${MW_TLS_KEY:-}
      MW_TLS_EMAIL: ${MW_TLS_EMAIL:-}
    ports:
      - "80:80/tcp"      # Let's Encrypt HTTP-01 challenge
      - "443:443/tcp"    # PowerDNS REST API over HTTPS (api.${MW_DOMAIN})
    volumes:
      - caddy_data:/data             # cert storage (Let's Encrypt)
      - caddy_config:/config
      - ./certs:/certs:ro            # your own certs when using MW_TLS_CERT/KEY
      - ../../website:/srv/site:ro   # presentation website (repo-root ./website)
      # Bootstrap entry page served at stream.${MW_DOMAIN}/{id} (repo-root
      # ./bootstrap). Same files the pages.yml workflow publishes to GitHub
      # Pages, which stays as the digest-stamped reference copy.
      - ../../bootstrap:/srv/bootstrap:ro
    networks: [mwnet]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]                   # bind :80 / :443
    pids_limit: 200
    mem_limit: 256m

  # ── Umami: privacy-friendly, cookieless web analytics ──────────────────────
  # Serves the presentation-site stats at https://stats.${MW_DOMAIN} (via caddy).
  # Internal only — never published to the host; caddy reverse-proxies :3000.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: moonlight-umami
    restart: unless-stopped
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://umami:${MW_UMAMI_DB_PASSWORD}@umami-db:5432/umami
      # Signs the auth cookies / API tokens of the Umami DASHBOARD (admin login),
      # not the tracked visitors (analytics stays cookieless). Keep it secret.
      APP_SECRET: ${MW_UMAMI_SECRET}
      # Trust the forwarded address instead of the socket peer. Everything
      # reaching Umami is proxied — caddy for the website, mw-proxy for the
      # update relay — so without this every event would carry the proxy's
      # container IP and collapse the whole fleet into one "visitor".
      CLIENT_IP_HEADER: x-forwarded-for
    networks: [mwnet]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 512m

  umami-db:
    image: postgres:16-alpine
    container_name: moonlight-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${MW_UMAMI_DB_PASSWORD}
    volumes:
      - umami_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [mwnet]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 256m

volumes:
  pdns_data:
  mwproxy_data:
  mwrdv_data:
  caddy_data:
  caddy_config:
  umami_db:

networks:
  mwnet:
    driver: bridge
    # Fixed subnet so pdns can keep a stable IP for dnsdist's backend address.
    ipam:
      config:
        - subnet: 172.28.0.0/24
