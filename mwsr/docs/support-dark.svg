<svg xmlns="http://www.w3.org/2000/svg" width="950" height="525" viewBox="0 0 950 525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">What MWSR, FSR1, NIS and SGSR1 each do</title>
<desc id="d">A table: upscale, downscale, HDR, 4:4:4 colour edges, input, precision, passes and licence of each. The same table is given as text below the figure.</desc>
<rect x="0" y="8" width="22" height="20" rx="4" fill="#173a1f" stroke="#3a3936"/>
<text x="11" y="18" font-size="13" fill="#f0efec" text-anchor="middle" dominant-baseline="middle">✓</text>
<text x="30" y="18" font-size="13" fill="#c3c2b7" dominant-baseline="middle">meets the need</text>
<rect x="148" y="8" width="22" height="20" rx="4" fill="#4a3d1e" stroke="#3a3936"/>
<text x="159" y="18" font-size="13" fill="#f0efec" text-anchor="middle" dominant-baseline="middle">◐</text>
<text x="178" y="18" font-size="13" fill="#c3c2b7" dominant-baseline="middle">with a condition or a limit</text>
<rect x="382" y="8" width="22" height="20" rx="4" fill="#45242a" stroke="#3a3936"/>
<text x="393" y="18" font-size="13" fill="#f0efec" text-anchor="middle" dominant-baseline="middle">✗</text>
<text x="412" y="18" font-size="13" fill="#c3c2b7" dominant-baseline="middle">no</text>
<rect x="0" y="40" width="950" height="34" fill="#22211f"/>
<text x="160" y="57" font-size="14" font-weight="600" fill="#3987e5" dominant-baseline="middle">MWSR</text>
<text x="360" y="57" font-size="14" font-weight="600" fill="#f0efec" dominant-baseline="middle">FSR1</text>
<text x="560" y="57" font-size="14" font-weight="600" fill="#f0efec" dominant-baseline="middle">NIS</text>
<text x="760" y="57" font-size="14" font-weight="600" fill="#f0efec" dominant-baseline="middle">SGSR1</text>
<text x="10" y="101" font-size="13" font-weight="600" fill="#f0efec" dominant-baseline="middle">Upscale</text>
<rect x="151" y="75" width="198" height="52" fill="#173a1f"/>
<text x="160" y="92" font-size="13" fill="#f0efec" dominant-baseline="middle">✓</text>
<text x="178" y="92" font-size="13" fill="#f0efec" dominant-baseline="middle">any factor</text>
<rect x="351" y="75" width="198" height="52" fill="#4a3d1e"/>
<text x="360" y="92" font-size="13" fill="#f0efec" dominant-baseline="middle">◐</text>
<text x="378" y="92" font-size="13" fill="#f0efec" dominant-baseline="middle">1× to 4× the area (2×</text>
<text x="378" y="109" font-size="13" fill="#f0efec" dominant-baseline="middle">per axis)</text>
<rect x="551" y="75" width="198" height="52" fill="#4a3d1e"/>
<text x="560" y="92" font-size="13" fill="#f0efec" dominant-baseline="middle">◐</text>
<text x="578" y="92" font-size="13" fill="#f0efec" dominant-baseline="middle">1× to 2× per axis</text>
<rect x="751" y="75" width="198" height="52" fill="#173a1f"/>
<text x="760" y="92" font-size="13" fill="#f0efec" dominant-baseline="middle">✓</text>
<text x="778" y="92" font-size="13" fill="#f0efec" dominant-baseline="middle">yes, no stated limit</text>
<line x1="0" y1="128" x2="950" y2="128" stroke="#3a3936"/>
<text x="10" y="163" font-size="13" font-weight="600" fill="#f0efec" dominant-baseline="middle">Downscale</text>
<rect x="151" y="129" width="198" height="69" fill="#173a1f"/>
<text x="160" y="146" font-size="13" fill="#f0efec" dominant-baseline="middle">✓</text>
<text x="178" y="146" font-size="13" fill="#f0efec" dominant-baseline="middle">yes: an area filter in</text>
<text x="178" y="163" font-size="13" fill="#f0efec" dominant-baseline="middle">linear light, 1 to 16</text>
<text x="178" y="180" font-size="13" fill="#f0efec" dominant-baseline="middle">samples, lightly sharpened</text>
<rect x="351" y="129" width="198" height="69" fill="#45242a"/>
<text x="360" y="146" font-size="13" fill="#f0efec" dominant-baseline="middle">✗</text>
<text x="378" y="146" font-size="13" fill="#f0efec" dominant-baseline="middle">no</text>
<rect x="551" y="129" width="198" height="69" fill="#45242a"/>
<text x="560" y="146" font-size="13" fill="#f0efec" dominant-baseline="middle">✗</text>
<text x="578" y="146" font-size="13" fill="#f0efec" dominant-baseline="middle">no: refused</text>
<rect x="751" y="129" width="198" height="69" fill="#45242a"/>
<text x="760" y="146" font-size="13" fill="#f0efec" dominant-baseline="middle">✗</text>
<text x="778" y="146" font-size="13" fill="#f0efec" dominant-baseline="middle">no</text>
<line x1="0" y1="199" x2="950" y2="199" stroke="#3a3936"/>
<text x="10" y="234" font-size="13" font-weight="600" fill="#f0efec" dominant-baseline="middle">HDR</text>
<rect x="151" y="200" width="198" height="69" fill="#173a1f"/>
<text x="160" y="217" font-size="13" fill="#f0efec" dominant-baseline="middle">✓</text>
<text x="178" y="217" font-size="13" fill="#f0efec" dominant-baseline="middle">yes: on a float texture</text>
<text x="178" y="234" font-size="13" fill="#f0efec" dominant-baseline="middle">past 1.0, without its</text>
<text x="178" y="251" font-size="13" fill="#f0efec" dominant-baseline="middle">margin</text>
<rect x="351" y="200" width="198" height="69" fill="#4a3d1e"/>
<text x="360" y="217" font-size="13" fill="#f0efec" dominant-baseline="middle">◐</text>
<text x="378" y="217" font-size="13" fill="#f0efec" dominant-baseline="middle">through a reversible</text>
<text x="378" y="234" font-size="13" fill="#f0efec" dominant-baseline="middle">tone map around it</text>
<text x="378" y="251" font-size="13" fill="#f0efec" dominant-baseline="middle">(FsrSrtm)</text>
<rect x="551" y="200" width="198" height="69" fill="#173a1f"/>
<text x="560" y="217" font-size="13" fill="#f0efec" dominant-baseline="middle">✓</text>
<text x="578" y="217" font-size="13" fill="#f0efec" dominant-baseline="middle">yes: NIS_HDR_MODE,</text>
<text x="578" y="234" font-size="13" fill="#f0efec" dominant-baseline="middle">linear or PQ</text>
<rect x="751" y="200" width="198" height="69" fill="#45242a"/>
<text x="760" y="217" font-size="13" fill="#f0efec" dominant-baseline="middle">✗</text>
<text x="778" y="217" font-size="13" fill="#f0efec" dominant-baseline="middle">no: its output is</text>
<text x="778" y="234" font-size="13" fill="#f0efec" dominant-baseline="middle">clamped to 0..1</text>
<line x1="0" y1="270" x2="950" y2="270" stroke="#3a3936"/>
<text x="10" y="305" font-size="13" font-weight="600" fill="#f0efec" dominant-baseline="middle">4:4:4 colour edges</text>
<rect x="151" y="271" width="198" height="69" fill="#173a1f"/>
<text x="160" y="288" font-size="13" fill="#f0efec" dominant-baseline="middle">✓</text>
<text x="178" y="288" font-size="13" fill="#f0efec" dominant-baseline="middle">yes, with CHROMA444: the</text>
<text x="178" y="305" font-size="13" fill="#f0efec" dominant-baseline="middle">vote per channel</text>
<rect x="351" y="271" width="198" height="69" fill="#45242a"/>
<text x="360" y="288" font-size="13" fill="#f0efec" dominant-baseline="middle">✗</text>
<text x="378" y="288" font-size="13" fill="#f0efec" dominant-baseline="middle">no: edges from the luma</text>
<rect x="551" y="271" width="198" height="69" fill="#45242a"/>
<text x="560" y="288" font-size="13" fill="#f0efec" dominant-baseline="middle">✗</text>
<text x="578" y="288" font-size="13" fill="#f0efec" dominant-baseline="middle">no: edges from the luma</text>
<rect x="751" y="271" width="198" height="69" fill="#45242a"/>
<text x="760" y="288" font-size="13" fill="#f0efec" dominant-baseline="middle">✗</text>
<text x="778" y="288" font-size="13" fill="#f0efec" dominant-baseline="middle">no: edges from green</text>
<line x1="0" y1="341" x2="950" y2="341" stroke="#3a3936"/>
<text x="10" y="376" font-size="13" font-weight="600" fill="#f0efec" dominant-baseline="middle">Input</text>
<rect x="151" y="342" width="198" height="69" fill="#173a1f"/>
<text x="160" y="359" font-size="13" fill="#f0efec" dominant-baseline="middle">✓</text>
<text x="178" y="359" font-size="13" fill="#f0efec" dominant-baseline="middle">an RGB texture: 8-bit,</text>
<text x="178" y="376" font-size="13" fill="#f0efec" dominant-baseline="middle">with or without sRGB</text>
<text x="178" y="393" font-size="13" fill="#f0efec" dominant-baseline="middle">views, or 16-bit float</text>
<rect x="351" y="342" width="198" height="69" fill="#4a3d1e"/>
<text x="360" y="359" font-size="13" fill="#f0efec" dominant-baseline="middle">◐</text>
<text x="378" y="359" font-size="13" fill="#f0efec" dominant-baseline="middle">RGB in 0..1, perceptual</text>
<rect x="551" y="342" width="198" height="69" fill="#173a1f"/>
<text x="560" y="359" font-size="13" fill="#f0efec" dominant-baseline="middle">✓</text>
<text x="578" y="359" font-size="13" fill="#f0efec" dominant-baseline="middle">RGB, or NV12</text>
<text x="578" y="376" font-size="13" fill="#f0efec" dominant-baseline="middle">(NIS_NV12_SUPPORT)</text>
<rect x="751" y="342" width="198" height="69" fill="#4a3d1e"/>
<text x="760" y="359" font-size="13" fill="#f0efec" dominant-baseline="middle">◐</text>
<text x="778" y="359" font-size="13" fill="#f0efec" dominant-baseline="middle">RGB in 0..1</text>
<line x1="0" y1="412" x2="950" y2="412" stroke="#3a3936"/>
<text x="10" y="430" font-size="13" font-weight="600" fill="#f0efec" dominant-baseline="middle">Precision</text>
<rect x="151" y="413" width="198" height="35" fill="#173a1f"/>
<text x="160" y="430" font-size="13" fill="#f0efec" dominant-baseline="middle">✓</text>
<text x="178" y="430" font-size="13" fill="#f0efec" dominant-baseline="middle">32-bit, or 16-bit</text>
<rect x="351" y="413" width="198" height="35" fill="#173a1f"/>
<text x="360" y="430" font-size="13" fill="#f0efec" dominant-baseline="middle">✓</text>
<text x="378" y="430" font-size="13" fill="#f0efec" dominant-baseline="middle">32-bit, or packed 16-bit</text>
<rect x="551" y="413" width="198" height="35" fill="#173a1f"/>
<text x="560" y="430" font-size="13" fill="#f0efec" dominant-baseline="middle">✓</text>
<text x="578" y="430" font-size="13" fill="#f0efec" dominant-baseline="middle">32-bit, or 16-bit</text>
<rect x="751" y="413" width="198" height="35" fill="#4a3d1e"/>
<text x="760" y="430" font-size="13" fill="#f0efec" dominant-baseline="middle">◐</text>
<text x="778" y="430" font-size="13" fill="#f0efec" dominant-baseline="middle">16-bit (half) only</text>
<line x1="0" y1="449" x2="950" y2="449" stroke="#3a3936"/>
<text x="10" y="467" font-size="13" font-weight="600" fill="#f0efec" dominant-baseline="middle">Passes</text>
<text x="160" y="467" font-size="13" fill="#f0efec" dominant-baseline="middle">1</text>
<text x="360" y="467" font-size="13" fill="#f0efec" dominant-baseline="middle">2</text>
<text x="560" y="467" font-size="13" fill="#f0efec" dominant-baseline="middle">1 (compute)</text>
<text x="760" y="467" font-size="13" fill="#f0efec" dominant-baseline="middle">1</text>
<line x1="0" y1="486" x2="950" y2="486" stroke="#3a3936"/>
<text x="10" y="504" font-size="13" font-weight="600" fill="#f0efec" dominant-baseline="middle">Licence</text>
<text x="160" y="504" font-size="13" fill="#f0efec" dominant-baseline="middle">MIT</text>
<text x="360" y="504" font-size="13" fill="#f0efec" dominant-baseline="middle">MIT</text>
<text x="560" y="504" font-size="13" fill="#f0efec" dominant-baseline="middle">MIT</text>
<text x="760" y="504" font-size="13" fill="#f0efec" dominant-baseline="middle">BSD-3-Clause</text>
<line x1="0" y1="523" x2="950" y2="523" stroke="#3a3936"/>
</svg>