# MoonlightWeb — multi-platform release packaging.
#
# On a v* tag, builds self-contained bundles for Windows x64/ARM64 (Inno Setup
# installer), Linux x64 (.deb + .rpm + AppImage) and macOS arm64 (interactive
# .pkg installer), then
# attaches them to the GitHub Release. Each bundle ships the executable, the Qt
# runtime (via the native deploy tool), OpenSSL and the frontend/ served as
# static files (staged by `cmake --install`, which strips dev tooling).
#
# CI (ci.yml) calls this same workflow as its last stage, so untagged installers
# can be downloaded from a manual CI run's artifacts and tested before a tag is
# cut. Only the version differs: a v* tag ships `1.2.3`, any other run ships
# `<last tag>-<3-char sha>` (e.g. 0.2.1-b7c).
name: release

# NO tag trigger here on purpose. A v* tag fires ci.yml, which validates the
# commit and then calls this workflow (workflow_call below) — so a release is
# always gated on green quality/tests, and the packaging matrix runs exactly
# once. Adding `push: tags` back would double every tag build and have the two
# runs race to upload the same GitHub Release assets.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform(s) to build and release"
        type: choice
        default: all
        options:
          - all
          - windows-x64
          - windows-arm64
          - linux
          - macos
  # Called by CI once the gates are green, so the installers come off this exact
  # packaging path — no second recipe to keep in sync. What the run does with
  # them depends on the caller's ref: the gh-release steps below stay gated on a
  # v* tag, so a CI run on a tag publishes the release, and a manual CI run on a
  # branch only uploads workflow artifacts.
  workflow_call:
    inputs:
      platform:
        description: "Platform(s) to build"
        type: string
        default: all

permissions:
  contents: write

jobs:
  # ── Platform selection ───────────────────────────────────────────────────
  # Turns the workflow_dispatch `platform` choice (default `all`, and `all` on a
  # v* tag push where the input is unset) into per-job gates. The Windows matrix
  # is emitted as JSON so a single arch can be selected; an empty array skips the
  # Windows job entirely.
  setup:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.sel.outputs.windows }}
      linux: ${{ steps.sel.outputs.linux }}
      macos: ${{ steps.sel.outputs.macos }}
      version: ${{ steps.ver.outputs.version }}
      pkg_version: ${{ steps.ver.outputs.pkg_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags: `git describe` needs the last v* tag
      - id: sel
        env:
          SEL: ${{ inputs.platform || 'all' }}
        run: |
          x64='{"arch":"x64","runner":"windows-latest","qt_arch":"win64_msvc2022_64","cmake_arch":"x64"}'
          arm='{"arch":"arm64","runner":"windows-11-arm","qt_arch":"win64_msvc2022_arm64","cmake_arch":"ARM64"}'
          win='[]'; lin='false'; mac='false'
          case "$SEL" in
            all)           win="[$x64,$arm]"; lin='true'; mac='true' ;;
            windows-x64)   win="[$x64]" ;;
            windows-arm64) win="[$arm]" ;;
            linux)         lin='true' ;;
            macos)         mac='true' ;;
          esac
          echo "windows=$win" >> "$GITHUB_OUTPUT"
          echo "linux=$lin"   >> "$GITHUB_OUTPUT"
          echo "macos=$mac"   >> "$GITHUB_OUTPUT"

      # Single version string for every platform job (installer file names,
      # MW_VERSION baked into the binary, artifact names):
      #   • v* tag push  → the tag, verbatim minus the "v" (v1.2.3 → 1.2.3)
      #   • anywhere else (CI on main, manual dispatch) → last v* tag + the
      #     3-char commit sha, e.g. 0.2.1-b7c, so a test installer says exactly
      #     which commit it came from.
      - id: ver
        run: |
          if [ "$GITHUB_REF" != "${GITHUB_REF#refs/tags/v}" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.2.1)
            # cut, not `rev-parse --short=3`: git refuses to abbreviate below 4.
            v="${tag#v}-$(git rev-parse HEAD | cut -c1-3)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # rpm rejects '-' in the Version field, so the Linux packages use a
          # dotted variant (0.2.1-b7c → 0.2.1.b7c). Identical on a tag build.
          echo "pkg_version=${v//-/.}" >> "$GITHUB_OUTPUT"
          echo "Version: $v" >> "$GITHUB_STEP_SUMMARY"

  # ── Windows (x64 + ARM64) ────────────────────────────────────────────────
  windows:
    needs: setup
    if: ${{ needs.setup.outputs.windows != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.windows) }}
    name: Package Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # Grants access to the MW_* secrets (DNS/ACME config embedded at build time).
    environment: MoonlightWeb
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install OpenSSL (vcpkg, arm64 only)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: vcpkg install openssl:arm64-windows

      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.0
          arch: ${{ matrix.qt_arch }}
          modules: qtwebsockets
          # aqt 3.3.0 doesn't know the new Qt 6.11 per-arch repo layout (404s on
          # Updates.xml); pin the commit that added it. py7zr 1.1.0 avoids the 7z
          # path-sanitization bug (aqtinstall#995) that breaks SBOM extraction.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          py7zrversion: ==1.1.0
          extra: --base https://download.qt.io # official server (fallback mirrors serve incomplete XML)

      # Ninja + MSVC env: the runner's Visual Studio major version changes over
      # time, so avoid the version-pinned "Visual Studio NN" generator.
      - name: Set up MSVC environment
        uses: ./.github/actions/msvc-env
        with:
          arch: ${{ matrix.arch }}

      - name: Configure
        shell: pwsh
        # Internet-Access config embedded at build time from repo secrets (no
        # .env shipped). Empty when a secret is unset → LAN-only fallback.
        env:
          MW_DOMAIN: ${{ secrets.MW_DOMAIN }}
          MW_PDNS_URL: ${{ secrets.MW_PDNS_URL }}
          MW_PDNS_TOKEN: ${{ secrets.MW_PDNS_TOKEN }}
          MW_ZEROSSL_EAB_KID: ${{ secrets.MW_ZEROSSL_EAB_KID }}
          MW_ZEROSSL_EAB_HMAC: ${{ secrets.MW_ZEROSSL_EAB_HMAC }}
        run: |
          $args = @("-S","backend","-B","build","-G","Ninja","-DCMAKE_BUILD_TYPE=Release",
                    "-DMW_VERSION=${{ needs.setup.outputs.version }}")
          if ("${{ matrix.arch }}" -eq "arm64") {
            $args += "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
            $args += "-DVCPKG_TARGET_TRIPLET=arm64-windows"
          }
          cmake @args

      - name: Build
        run: cmake --build build -j

      # Archive the debug symbols so a crash minidump (CrashHandler.cpp) from this
      # exact build can be symbolized later. The Release build emits MoonlightWeb.pdb
      # via /DEBUG. Kept as a workflow artifact for maintainers only — NOT attached
      # to the public Release (symbols aid reverse engineering and are not for end
      # users). Retained the default 90 days; download the matching arch's PDB to
      # resolve a dump collected from that release.
      - name: Archive debug symbols (PDB)
        uses: actions/upload-artifact@v6
        with:
          name: MoonlightWeb-pdb-${{ matrix.arch }}-${{ needs.setup.outputs.version }}
          path: build/MoonlightWeb.pdb
          if-no-files-found: error

      - name: Stage bundle
        run: cmake --install build --prefix dist

      - name: Deploy Qt runtime
        run: windeployqt --release dist/MoonlightWeb.exe

      # windeployqt ships only the schannel/certonly TLS backends. Force-copy the
      # OpenSSL backend plugin so QSslSocket::setActiveBackend("openssl") (main.cpp)
      # succeeds; otherwise Qt falls back to Schannel, which cannot load the public
      # ACME PEM key and the browser is served the self-signed cert (CN/SAN error).
      - name: Deploy Qt OpenSSL TLS plugin
        shell: pwsh
        run: |
          $wdq = (Get-Command windeployqt).Source
          $tlsSrc = Join-Path (Split-Path (Split-Path $wdq)) "plugins\tls\qopensslbackend.dll"
          New-Item -ItemType Directory -Force -Path dist\tls | Out-Null
          Copy-Item $tlsSrc dist\tls\qopensslbackend.dll -Force
          Write-Host "Deployed $tlsSrc"

      - name: Bundle OpenSSL (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/arm64-windows/bin/*.dll" dist/ -ErrorAction SilentlyContinue

      # ── Authenticode signing (SignPath) ──────────────────────────────────
      # Without a signature Windows SmartScreen greets every download with
      # "Windows protected your PC", and it never stops: reputation accrues to
      # the signing certificate, so an unsigned build restarts from zero on each
      # release no matter how many people install it.
      #
      # SignPath signs remotely. The private key never reaches this runner, so
      # there is no signtool here and nothing to hand ISCC — every pass is a
      # round trip through the Actions artifact store, which is the only input
      # SignPath's action accepts. Hence the shape of what follows:
      #   • the payload exe is signed BEFORE ISCC packages it,
      #   • the installer is signed AFTER ISCC produces it,
      #   • the uninstaller is not signed at all (see moonlightweb.iss).
      #
      # The slugs below are defined in the SignPath project, not here — they
      # must match the project / signing policy / artifact configuration set up
      # at signpath.io or the request is rejected. Two artifact configurations
      # are needed because a bare .exe and an Inno installer are different
      # shapes to SignPath.
      #
      # All of it is skipped when SIGNPATH_API_TOKEN is unset, so forks and runs
      # without the MoonlightWeb environment keep emitting the same unsigned
      # installer as before — loudly, via a run annotation, not silently.
      - name: Detect signing secrets
        id: signing
        shell: pwsh
        run: |
          $on = -not [string]::IsNullOrWhiteSpace("${{ secrets.SIGNPATH_API_TOKEN }}")
          "enabled=$($on.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not $on) {
            Write-Host "::warning title=Unsigned build::No SignPath token configured - this installer is UNSIGNED and will trip SmartScreen."
          }

      # An intermediate, not a deliverable: it exists only because SignPath
      # takes its input from the artifact store. One-day retention keeps the
      # unsigned exe from lingering next to the real artifacts.
      - name: Upload payload for signing
        id: payload-unsigned
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-payload-${{ matrix.arch }}
          path: dist/MoonlightWeb.exe
          if-no-files-found: error
          retention-days: 1

      # continue-on-error: signing is a quality of the release, not a condition
      # of it. A SignPath outage, an expired token or a project that is not set
      # up yet must not cost the whole Windows installer — the swap below is
      # gated on the outcome, so a failed request simply leaves the unsigned
      # payload in place and the run is annotated.
      - name: Sign payload (SignPath)
        id: sign-payload
        if: steps.signing.outputs.enabled == 'true'
        continue-on-error: true
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: moonlight-web
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-payload
          github-artifact-id: ${{ steps.payload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-payload

      # MoonlightWeb.exe is the only first-party binary cmake stages
      # (backend/CMakeLists.txt:359) — Qt's and OpenSSL's DLLs arrive with their
      # own signatures. It has to be signed before ISCC swallows it: the service
      # registers it to run at boot, so an unsigned copy inside a signed
      # installer would still get flagged on first launch.
      - name: Swap in the signed payload
        if: steps.sign-payload.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signed = "signed-payload\MoonlightWeb.exe"
          if (-not (Test-Path $signed)) { throw "SignPath returned no $signed" }
          Copy-Item $signed dist\MoonlightWeb.exe -Force

      # Interactive installer: stepped wizard (Internet authorization, Sunshine
      # detection/silent-install + pairing, Desktop admin shortcut). It is the
      # only Windows artifact shipped (no raw zip).
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        shell: pwsh
        # DNS/ACME secrets are compiled into MoonlightWeb.exe at build time, not
        # passed to the installer — nothing on the user's machine carries them.
        # No signing arguments: ISCC has no local signtool to call (see the note
        # at the top of moonlightweb.iss); the installer is signed below.
        run: |
          $ErrorActionPreference = "Stop"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DSourceDir=$(Resolve-Path dist)" `
            "/DMyArch=${{ matrix.arch }}" `
            "/DMyAppVersion=${{ needs.setup.outputs.version }}" `
            "/O$(Get-Location)" `
            backend\installer\moonlightweb.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Upload installer for signing
        id: installer-unsigned
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-installer-${{ matrix.arch }}
          path: MoonlightWeb-installer-${{ needs.setup.outputs.version }}-win-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer (SignPath)
        id: sign-installer
        if: steps.signing.outputs.enabled == 'true'
        continue-on-error: true
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: moonlight-web
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.installer-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer

      # Overwrite in place so the two publish steps below need no knowledge of
      # signing and can never ship the unsigned build by accident.
      - name: Swap in the signed installer
        if: steps.sign-installer.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "MoonlightWeb-installer-${{ needs.setup.outputs.version }}-win-${{ matrix.arch }}.exe"
          $signed = Join-Path "signed-installer" $name
          if (-not (Test-Path $signed)) { throw "SignPath returned no $signed" }
          Copy-Item $signed $name -Force

      # One annotation for whichever half failed, so an unsigned release is
      # never a silent one. Both are reported: the payload and the installer are
      # signed by two different artifact configurations and can fail apart.
      - name: Report a failed signing request
        if: steps.signing.outputs.enabled == 'true' && (steps.sign-payload.outcome != 'success' || steps.sign-installer.outcome != 'success')
        shell: pwsh
        run: |
          $p = "${{ steps.sign-payload.outcome }}"
          $i = "${{ steps.sign-installer.outcome }}"
          Write-Host "::warning title=Unsigned Windows build::SignPath request failed (payload: $p, installer: $i) - ${{ matrix.arch }} ships UNSIGNED and will trip SmartScreen. Check the project, signing policy and artifact configuration slugs at signpath.io."

      # Downloadable on every run (incl. the CI call on main and a
      # workflow_dispatch with no tag).
      - uses: actions/upload-artifact@v6
        with:
          name: MoonlightWeb-windows-${{ matrix.arch }}-v${{ needs.setup.outputs.version }}
          path: MoonlightWeb-installer-${{ needs.setup.outputs.version }}-win-${{ matrix.arch }}.exe

      # Published to the GitHub Release only on a v* tag push.
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: MoonlightWeb-installer-${{ needs.setup.outputs.version }}-win-${{ matrix.arch }}.exe

  # ── Linux x64 (.deb + .rpm + AppImage) ───────────────────────────────────
  # One linuxdeploy AppDir (bundled Qt, $ORIGIN rpaths) feeds all three outputs:
  #   .deb  → Debian/Ubuntu/Mint (double-click install, no chmod)
  #   .rpm  → Fedora/RHEL/openSUSE/Nobara
  #   .AppImage → portable fallback (Arch, immutable gaming distros: SteamOS…)
  linux:
    needs: setup
    if: ${{ needs.setup.outputs.linux == 'true' }}
    name: Package Linux x64
    # NOT ubuntu-latest: the build host sets the glibc/libstdc++ floor for every
    # Linux artifact. linuxdeploy bundles Qt and OpenSSL but never the C runtime,
    # so a 24.04 build (glibc 2.39, GCC 13) refuses to start on anything older —
    # "version `GLIBC_2.38' not found" on Ubuntu 22.04, Mint 21, Debian 12.
    # 22.04 (glibc 2.35, GCC 11) is the oldest image GitHub still hosts and runs
    # everywhere newer; C++17 + CMake 3.21 + OpenSSL 1.1 (see backend/CMakeLists)
    # are all satisfied there. Revisit only when 22.04 is retired.
    runs-on: ubuntu-22.04
    # Grants access to the MW_* secrets (DNS/ACME config embedded at build time).
    environment: MoonlightWeb
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libssl-dev libfuse2 wget rpm ruby appstream
          # fpm turns the staged tree into .deb + .rpm (see make-packages.sh);
          # appstream provides appstreamcli, which validates the metainfo file
          # there before a broken one reaches anyone's software centre.
          sudo gem install --no-document fpm

      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.0
          modules: qtwebsockets
          # aqt 3.3.0 doesn't know the new Qt 6.11 per-arch repo layout (404s on
          # Updates.xml); pin the commit that added it. py7zr 1.1.0 avoids the 7z
          # path-sanitization bug (aqtinstall#995) that breaks SBOM extraction.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          py7zrversion: ==1.1.0
          extra: --base https://download.qt.io # official server (fallback mirrors serve incomplete XML)

      - name: Build
        # Internet-Access config embedded at build time from repo secrets (no
        # .env shipped). Empty when a secret is unset → LAN-only fallback.
        env:
          MW_DOMAIN: ${{ secrets.MW_DOMAIN }}
          MW_PDNS_URL: ${{ secrets.MW_PDNS_URL }}
          MW_PDNS_TOKEN: ${{ secrets.MW_PDNS_TOKEN }}
          MW_ZEROSSL_EAB_KID: ${{ secrets.MW_ZEROSSL_EAB_KID }}
          MW_ZEROSSL_EAB_HMAC: ${{ secrets.MW_ZEROSSL_EAB_HMAC }}
        run: |
          cmake -S backend -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMW_VERSION=${{ needs.setup.outputs.pkg_version }}
          cmake --build build -j

      # Same gate the CI build job applies; packaging is the only build on a
      # push to main, so the TNR has to run here too.
      - name: Security TNR (ctest)
        run: ctest --test-dir build --output-on-failure

      # `cmake --install` applies the frontend excludes (node_modules, tests,
      # .claude, lint configs) — never copy frontend/ straight from the checkout.
      - name: Assemble AppDir
        run: |
          cmake --install build --prefix stage
          mkdir -p AppDir/usr/bin
          cp build/MoonlightWeb AppDir/usr/bin/
          cp -r stage/frontend AppDir/usr/bin/frontend
          cp frontend/assets/icon-512.png AppDir/MoonlightWeb.png

      - name: Deploy Qt into AppDir
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -e build/MoonlightWeb \
            -d backend/packaging/moonlightweb.desktop \
            -i AppDir/MoonlightWeb.png \
            --plugin qt

      # linuxdeploy-plugin-qt only bundles the xcb platform plugin; add the
      # Wayland client plugins so native Wayland sessions (GNOME/KDE defaults)
      # don't warn and fall back to XWayland. Best-effort: Qt prebuilt plugins
      # already carry $ORIGIN/../../lib rpaths matching the AppDir layout, and
      # xcb remains the fallback if anything here is absent.
      - name: Bundle Qt Wayland plugins (best effort)
        run: |
          P="$QT_ROOT_DIR/plugins"; L="$QT_ROOT_DIR/lib"
          if [ -f "$P/platforms/libqwayland-generic.so" ]; then
            cp -a "$P"/platforms/libqwayland-*.so AppDir/usr/plugins/platforms/
            for d in wayland-decoration-client wayland-graphics-integration-client wayland-shell-integration; do
              if [ -d "$P/$d" ]; then cp -a "$P/$d" AppDir/usr/plugins/; fi
            done
            cp -a "$L"/libQt6WaylandClient.so* AppDir/usr/lib/ 2>/dev/null || true
            cp -a "$L"/libQt6WaylandEglClientHwIntegration.so* AppDir/usr/lib/ 2>/dev/null || true
            echo "Wayland client plugins bundled"
          else
            echo "Qt Wayland plugins not present in this Qt install — skipped"
          fi

      # AppImage: portable fallback for distros without deb/rpm (Arch, and
      # immutable gaming distros like SteamOS/Bazzite). Needs chmod +x once.
      - name: Build AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          mv MoonlightWeb*.AppImage moonlightweb-${{ needs.setup.outputs.pkg_version }}-linux-x64.AppImage

      # Native packages: double-click installs via the distro's GUI installer
      # (no chmod needed). .deb → Debian/Ubuntu/Mint, .rpm → Fedora/RHEL/Nobara.
      - name: Build .deb + .rpm
        run: |
          chmod +x backend/packaging/linux/make-packages.sh
          backend/packaging/linux/make-packages.sh AppDir ${{ needs.setup.outputs.pkg_version }} .

      # Downloadable on every run (incl. the CI call on main, which never tags).
      - uses: actions/upload-artifact@v6
        with:
          name: moonlightweb-linux-x64-v${{ needs.setup.outputs.pkg_version }}
          path: |
            moonlightweb-${{ needs.setup.outputs.pkg_version }}-linux-x64.deb
            moonlightweb-${{ needs.setup.outputs.pkg_version }}-linux-x64.rpm
            moonlightweb-${{ needs.setup.outputs.pkg_version }}-linux-x64.AppImage

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            moonlightweb-${{ needs.setup.outputs.pkg_version }}-linux-x64.deb
            moonlightweb-${{ needs.setup.outputs.pkg_version }}-linux-x64.rpm
            moonlightweb-${{ needs.setup.outputs.pkg_version }}-linux-x64.AppImage

  # ── macOS arm64 (.pkg) ───────────────────────────────────────────────────
  macos:
    needs: setup
    if: ${{ needs.setup.outputs.macos == 'true' }}
    name: Package macOS arm64
    # Pinned (not macos-latest) to avoid the June 2026 macOS 26 auto-migration.
    runs-on: macos-15
    # Grants access to the MW_* secrets (DNS/ACME config embedded at build time).
    environment: MoonlightWeb
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: brew install cmake ninja openssl@3 pkg-config

      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.0
          host: mac
          arch: clang_64 # Qt 6.11 mac desktop is a universal (arm64+x64) binary
          modules: qtwebsockets
          # aqt 3.3.0 doesn't know the new Qt 6.11 per-arch repo layout (404s on
          # Updates.xml); pin the commit that added it. py7zr 1.1.0 avoids the 7z
          # path-sanitization bug (aqtinstall#995) that breaks SBOM extraction.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          py7zrversion: ==1.1.0
          extra: --base https://download.qt.io # official server (fallback mirrors serve incomplete XML)

      - name: Build
        # Internet-Access config embedded at build time from repo secrets (no
        # .env shipped). Empty when a secret is unset → LAN-only fallback.
        env:
          MW_DOMAIN: ${{ secrets.MW_DOMAIN }}
          MW_PDNS_URL: ${{ secrets.MW_PDNS_URL }}
          MW_PDNS_TOKEN: ${{ secrets.MW_PDNS_TOKEN }}
          MW_ZEROSSL_EAB_KID: ${{ secrets.MW_ZEROSSL_EAB_KID }}
          MW_ZEROSSL_EAB_HMAC: ${{ secrets.MW_ZEROSSL_EAB_HMAC }}
        run: |
          cmake -S backend -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMW_VERSION=${{ needs.setup.outputs.version }}
          cmake --build build -j

      # Same gate the CI build job applies; packaging is the only build on a
      # push to main, so the TNR has to run here too.
      - name: Security TNR (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Assemble .app bundle
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          APP=MoonlightWeb.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/MoonlightWeb "$APP/Contents/MacOS/MoonlightWeb"
          # Frontend assets go in Resources/, NOT MacOS/: codesign treats every
          # file under Contents/MacOS as code and rejects non-code assets. The
          # backend falls back to ../Resources/frontend at runtime. `cmake
          # --install` applies the frontend excludes (node_modules, tests,
          # .claude — the dev files that also trip codesign).
          cmake --install build --prefix stage
          cp -r stage/frontend "$APP/Contents/Resources/frontend"

          # App icon: Finder/Dock ignore the bundle without a real .icns, so
          # derive the iconset from the 512px PNG (skip the 1024 @2x variant —
          # upscaling the 512 source buys nothing).
          mkdir icon.iconset
          for s in 16 32 128 256; do
            sips -z $s $s frontend/assets/icon-512.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s * 2))
            sips -z $d $d frontend/assets/icon-512.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          sips -z 512 512 frontend/assets/icon-512.png --out icon.iconset/icon_512x512.png >/dev/null
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/MoonlightWeb.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>MoonlightWeb</string>
            <key>CFBundleIdentifier</key><string>com.moonlightweb.server</string>
            <key>CFBundleName</key><string>MoonlightWeb</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>MoonlightWeb</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST

      - name: Deploy Qt + sign bundle
        run: |
          # Deploy the Qt frameworks into the bundle.
          macdeployqt MoonlightWeb.app

          # Ad-hoc re-sign (identity "-"): no Apple Developer account needed, but
          # it stops Gatekeeper flagging the bundle as "damaged". Users still get
          # a one-time "unidentified developer" prompt (right-click → Open).
          #
          # We must NOT use `codesign --deep`: it unreliably re-signs frameworks
          # that already carry a signature. The Qt binaries from aqt are signed
          # with The Qt Company's Team ID; --deep left them intact while the main
          # binary became ad-hoc (empty Team ID), so at launch dyld rejected them
          # with "mapping process and mapped file have different Team IDs" and the
          # app crashed. Instead sign inside-out, explicitly, each Mach-O first,
          # then the app bundle last, forcing every signature to ad-hoc.
          find MoonlightWeb.app/Contents/Frameworks \
            \( -name '*.dylib' -o -name '*.framework' \) -print0 |
            xargs -0 -I {} codesign --force --timestamp=none -s - {}
          # Any plugins deployed alongside (platforms, tls, imageformats, ...).
          find MoonlightWeb.app/Contents/PlugIns -name '*.dylib' -print0 2>/dev/null |
            xargs -0 -I {} codesign --force --timestamp=none -s - {} || true
          # Main executable, then the whole bundle (seals everything above).
          codesign --force --timestamp=none -s - MoonlightWeb.app/Contents/MacOS/MoonlightWeb
          codesign --force --timestamp=none -s - MoonlightWeb.app
          # Verify the seal is internally consistent (no Team-ID mismatch).
          codesign --verify --deep --strict --verbose=2 MoonlightWeb.app

      - name: Build interactive .pkg installer
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        # Compiles the Installer.app plugin (Sunshine credentials + Internet
        # toggle + Sunshine download progress), packs the signed app + the
        # postinstall (installs Sunshine, writes provisioning.json, LaunchAgent,
        # launches the app) into the component pkg, and wraps it in a guided
        # productbuild archive. Pairing + the public A-record run in the app on
        # first launch (Provisioning::applyOnce). Unsigned: no Apple Developer
        # account (same posture as the old ad-hoc DMG).
        run: |
          APP="$PWD/MoonlightWeb.app" \
          OUT="$PWD/moonlightweb-${{ needs.setup.outputs.version }}-macos-arm64.pkg" \
            bash backend/installer/macos/build-pkg.sh

      - uses: actions/upload-artifact@v6
        with:
          name: moonlightweb-macos-arm64-v${{ needs.setup.outputs.version }}
          path: moonlightweb-${{ needs.setup.outputs.version }}-macos-arm64.pkg

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: moonlightweb-${{ needs.setup.outputs.version }}-macos-arm64.pkg

  # ── Homebrew tap ─────────────────────────────────────────────────────────
  # Publishes the cask that makes `brew install --cask linckosz/tap/moonlightweb`
  # work. This is the only macOS install path with no Gatekeeper warning at all:
  # the .pkg is not notarized (Apple has no free tier and no OSS programme), so
  # a double-clicked download is refused as "unidentified developer" — but
  # Homebrew hands the .pkg to installer(8) as root, and installer(8) never
  # consults Gatekeeper.
  #
  # Runs only on a v* tag: the cask points at a release asset URL, which does
  # not exist for the untagged 0.2.1-b7c builds. Skipped, loudly, when
  # HOMEBREW_TAP_TOKEN is unset — same posture as the SignPath steps above.
  homebrew:
    needs: [setup, macos]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    name: Publish Homebrew cask
    runs-on: ubuntu-latest
    environment: MoonlightWeb
    steps:
      - uses: actions/checkout@v5

      - name: Check tap credentials
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Homebrew cask not published::HOMEBREW_TAP_TOKEN is unset - the tap still points at the previous version."
          fi

      # The cask pins a sha256, so it has to be computed from the exact file the
      # macos job just published — not re-downloaded from the release, which may
      # not be visible yet when this runs.
      - name: Download the released .pkg
        if: steps.tap.outputs.enabled == 'true'
        uses: actions/download-artifact@v6
        with:
          name: moonlightweb-macos-arm64-v${{ needs.setup.outputs.version }}

      - name: Render the cask
        if: steps.tap.outputs.enabled == 'true'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          PKG="moonlightweb-${VERSION}-macos-arm64.pkg"
          [ -f "$PKG" ] || { echo "::error::$PKG not found in the artifact"; exit 1; }
          SHA="$(sha256sum "$PKG" | cut -d' ' -f1)"
          sed -e "s/@MW_VERSION@/${VERSION}/g" -e "s/@MW_SHA256@/${SHA}/g" \
            backend/packaging/homebrew/moonlightweb.rb > moonlightweb.rb
          echo "cask: moonlightweb ${VERSION} sha256 ${SHA}" >> "$GITHUB_STEP_SUMMARY"

      # A PAT (or fine-grained token with Contents: write on linckosz/homebrew-tap)
      # — GITHUB_TOKEN is scoped to this repo and cannot push to the tap. A
      # fine-grained token has to name that repository explicitly, so one minted
      # before the tap existed cannot reach it.
      #
      # continue-on-error: the release is already published by the time this
      # runs. A rejected token or a missing tap must leave the cask stale, not
      # turn a good release red.
      - name: Push to the tap
        id: tap-push
        if: steps.tap.outputs.enabled == 'true'
        continue-on-error: true
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/linckosz/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp moonlightweb.rb tap/Casks/moonlightweb.rb
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap add Casks/moonlightweb.rb
          # Re-running a tag build must not fail on an empty commit.
          if git -C tap diff --cached --quiet; then
            echo "cask already at ${VERSION}, nothing to push"
            exit 0
          fi
          git -C tap commit -m "moonlightweb ${VERSION}"
          git -C tap push

      - name: Report a failed tap push
        if: steps.tap-push.outcome == 'failure'
        run: |
          echo "::warning title=Homebrew cask not updated::Pushing to linckosz/homebrew-tap failed - the cask still points at the previous version. Check that HOMEBREW_TAP_TOKEN grants Contents: write on that repository."

  # ── Linux package repositories ───────────────────────────────────────────
  # Builds the signed APT and DNF repositories served at
  # https://linckosz.github.io/moonlight-web/. This is what turns a one-off
  # download into a managed install: `apt install moonlightweb`, updates through
  # the system updater, and — thanks to the DEP-11 index compiled from the
  # metainfo file in the package — an entry in GNOME Software, KDE Discover and
  # Ubuntu's App Center, which index AppStream rather than the package list.
  #
  # The tree leaves as a Pages deployment artifact rather than a gh-pages
  # commit: it is ~100 MB of binaries per release, and a branch holding them
  # would be fetched by every `git clone` of this repository. Deploying it is
  # the separate `linux-repo-deploy` job below, because a job may declare only
  # one environment and this one needs MoonlightWeb for the signing key.
  #
  # Tag-only, because the repository must never advertise a version that has no
  # release behind it. Skipped, loudly, when GPG_PRIVATE_KEY is unset — same
  # posture as the SignPath and Homebrew steps.
  linux-repo:
    needs: [setup, linux]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    name: Build APT + DNF repositories
    # Not the 22.04 pin the `linux` job needs: nothing is compiled here, and a
    # current appstreamcli produces a better DEP-11 index.
    runs-on: ubuntu-latest
    environment: MoonlightWeb
    outputs:
      published: ${{ steps.sign.outputs.enabled }}
    permissions:
      contents: read
      # configure-pages switches the repository to Actions-based publishing on
      # the first run, so nobody has to click through Settings → Pages.
      pages: write
    steps:
      - uses: actions/checkout@v5

      - name: Check signing key
        id: sign
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Package repositories not published::GPG_PRIVATE_KEY is unset - apt/dnf still serve the previous version."
          fi

      - name: Configure GitHub Pages
        if: steps.sign.outputs.enabled == 'true'
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install repository tooling
        if: steps.sign.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          # apt-utils → apt-ftparchive, rpm → rpmsign, appstream → appstreamcli.
          sudo apt-get install -y apt-utils createrepo-c rpm appstream
          # `appstreamcli compose` (the DEP-11 generator) is split into its own
          # binary package on some Ubuntu releases and bundled on others.
          if ! appstreamcli compose --help >/dev/null 2>&1; then
            sudo apt-get install -y appstream-compose
          fi
          appstreamcli compose --help >/dev/null 2>&1 \
            || { echo "::error::appstreamcli compose is unavailable on this runner"; exit 1; }

      # The exact files the `linux` job published, not a re-download of the
      # release assets, which may not be visible yet when this runs.
      - name: Download the Linux packages
        if: steps.sign.outputs.enabled == 'true'
        uses: actions/download-artifact@v6
        with:
          name: moonlightweb-linux-x64-v${{ needs.setup.outputs.pkg_version }}

      - name: Import the signing key
        if: steps.sign.outputs.enabled == 'true'
        id: key
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_KEY" | gpg --batch --quiet --import
          # The long key ID both gpg and rpmsign are addressed with below.
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          [ -n "$FPR" ] || { echo "::error::GPG_PRIVATE_KEY holds no secret key"; exit 1; }
          echo "fpr=$FPR" >> "$GITHUB_OUTPUT"
          # Passphrase-less signing without a tty, for both gpg and rpmsign.
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --reload gpg-agent

      - name: Build the repositories
        if: steps.sign.outputs.enabled == 'true'
        env:
          VERSION: ${{ needs.setup.outputs.pkg_version }}
        run: |
          set -euo pipefail
          mkdir -p site
          chmod +x backend/packaging/linux/make-repo.sh
          backend/packaging/linux/make-repo.sh \
            "moonlightweb-${VERSION}-linux-x64.deb" \
            "moonlightweb-${VERSION}-linux-x64.rpm" \
            "${VERSION}" site "${{ steps.key.outputs.fpr }}"
          {
            echo "### Linux package repositories"
            echo ""
            echo "Built \`moonlightweb ${VERSION}\` for <https://linckosz.github.io/moonlight-web/>."
            echo ""
            echo '```sh'
            echo "sudo apt install moonlightweb   # after adding the repository"
            echo "sudo dnf install moonlightweb"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Pages artifact
        if: steps.sign.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # ── Pages deployment ─────────────────────────────────────────────────────
  # Split out only because a job may declare a single environment, and
  # deploy-pages requires `github-pages` while the build above requires
  # `MoonlightWeb` for the signing key. Skipped along with the build when
  # GPG_PRIVATE_KEY is unset, since there would be no artifact to deploy.
  linux-repo-deploy:
    needs: linux-repo
    if: ${{ needs.linux-repo.outputs.published == 'true' }}
    name: Deploy the package repositories
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pages allows one deployment at a time; queue rather than cancel, so a
    # release never lands half-published.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # ── AUR ──────────────────────────────────────────────────────────────────
  # Publishes moonlightweb-bin, the native install path for Arch, Manjaro and
  # EndeavourOS — the one family with no repository of ours (Arch has no stable
  # base to build a shared binary against; the AUR repackages the .deb instead).
  #
  # Tag-only: the PKGBUILD pins a sha256 of a release asset. Skipped, loudly,
  # when AUR_SSH_KEY is unset — same posture as the other publishing jobs.
  aur:
    needs: [setup, linux]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    name: Publish AUR package
    runs-on: ubuntu-latest
    environment: MoonlightWeb
    steps:
      - uses: actions/checkout@v5

      - name: Check AUR credentials
        id: aur
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -n "$AUR_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=AUR package not published::AUR_SSH_KEY is unset - moonlightweb-bin still points at the previous version."
          fi

      - name: Download the released .deb
        if: steps.aur.outputs.enabled == 'true'
        uses: actions/download-artifact@v6
        with:
          name: moonlightweb-linux-x64-v${{ needs.setup.outputs.pkg_version }}

      # Both files are rendered from the same two values, because the AUR reads
      # .SRCINFO and makepkg reads the PKGBUILD — a mismatch between them is the
      # classic way an AUR package breaks.
      - name: Render PKGBUILD and .SRCINFO
        if: steps.aur.outputs.enabled == 'true'
        env:
          VERSION: ${{ needs.setup.outputs.pkg_version }}
        run: |
          set -euo pipefail
          DEB="moonlightweb-${VERSION}-linux-x64.deb"
          [ -f "$DEB" ] || { echo "::error::$DEB not found in the artifact"; exit 1; }
          SHA="$(sha256sum "$DEB" | cut -d' ' -f1)"
          mkdir -p aur-out
          for f in PKGBUILD .SRCINFO; do
            sed -e "s/@MW_VERSION@/${VERSION}/g" -e "s/@MW_SHA256@/${SHA}/g" \
              "backend/packaging/aur/$f" > "aur-out/$f"
          done
          echo "aur: moonlightweb-bin ${VERSION} sha256 ${SHA}" >> "$GITHUB_STEP_SUMMARY"

      # continue-on-error for the same reason as the tap push: the release is
      # already out, a refused key must leave the AUR stale rather than red.
      - name: Push to the AUR
        id: aur-push
        if: steps.aur.outputs.enabled == 'true'
        continue-on-error: true
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_KEY }}
          VERSION: ${{ needs.setup.outputs.pkg_version }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Trust on first use. The AUR publishes no stable pinnable fingerprint
          # policy, and the push is authenticated by the key either way.
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF

          git clone ssh://aur@aur.archlinux.org/moonlightweb-bin.git aur
          cp aur-out/PKGBUILD aur-out/.SRCINFO aur/
          git -C aur config user.name "github-actions[bot]"
          git -C aur config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C aur add PKGBUILD .SRCINFO
          # Re-running a tag build must not fail on an empty commit.
          if git -C aur diff --cached --quiet; then
            echo "AUR package already at ${VERSION}, nothing to push"
            exit 0
          fi
          git -C aur commit -m "moonlightweb-bin ${VERSION}"
          git -C aur push

      - name: Report a failed AUR push
        if: steps.aur-push.outcome == 'failure'
        run: |
          echo "::warning title=AUR package not updated::Pushing moonlightweb-bin failed - it still points at the previous version. Check that AUR_SSH_KEY matches a key registered on the aur.archlinux.org account."
